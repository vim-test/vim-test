name: CI
on:
  pull_request:
  push:
     branches:
      - 'master'

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: webiny/action-conventional-commits@v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-actions-lock-verify:
    name: Verify GitHub Actions lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  unit-tests:
    name: Unit tests
    strategy:
      matrix:
        os: [ubuntu-latest]
        neovim: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Vim or Neovim
        uses: rhysd/action-setup-vim@v1.6.1
        id: vim
        with:
          neovim: ${{ matrix.neovim }}
      - uses: ruby/setup-ruby@v1.341.0
      - name: Install dependencies
        run: |
          gem install vim-flavor -v '~> 4.0.1'
          vim-flavor install
      - name: Run unit tests
        run: vim-flavor test spec/
